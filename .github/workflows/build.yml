name: fur602 23.05 测试固件（fork chinadns-ng）

on:
  workflow_dispatch:
  schedule:
    # UTC 22:30 = 北京时间每天 06:30，跟随 fork 的 chinadns-ng 最新构建
    - cron: "30 22 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 355

    steps:
      - name: 拉取本仓库
        uses: actions/checkout@v5

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt update -y
          sudo apt install -y --no-install-recommends ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang clangd cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev \
          libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5 libncursesw5-dev libreadline-dev \
          libssl-dev libtool lld lldb lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
          python3 python3-pip python3-ply python3-docutils qemu-utils re2c rsync scons squashfs-tools subversion swig \
          texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo apt clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: 清理 GitHub Runner 编译空间
        run: |
          echo "清理前："
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          echo "清理后："
          df -h /

      - name: 检查 Runner 可用空间
        run: |
          df -h / "$GITHUB_WORKSPACE"
          workspace_available_kb="$(df --output=avail "$GITHUB_WORKSPACE" | tail -1)"
          if [ "$workspace_available_kb" -lt 73400320 ]; then
            echo "错误：工作区可用空间不足 70 GiB，停止编译以避免中途耗尽。" >&2
            exit 1
          fi

      - name: 编译固件
        run: |
          build_date="$(date +%Y%m%d)"
          echo "image_name=fur602-chinadns-test-${build_date}" >> "$GITHUB_ENV"
          echo "release_tag=fur602-chinadns-test-${build_date}" >> "$GITHUB_ENV"
          bash build_firmware.sh
        env:
          GOPROXY: https://goproxy.cn,direct

      - name: 打包固件
        run: |
          set -e -o pipefail
          rm -rf ./artifact/
          mkdir -p ./artifact/
          mv openwrt/bin/targets/mediatek/mt7981/immortalwrt-*squashfs* ./artifact/
          cd artifact
          7z a -t7z -m0=lzma2 -mx=9 -md=256m -mfb=273 -ms=on -mmt=on -myx=9 ../${{ env.image_name }}.7z .

      - name: 创建 Release
        uses: ncipollo/release-action@v1.21.0
        with:
          name: ${{ env.release_tag }}
          allowUpdates: true
          prerelease: false
          tag: ${{ env.release_tag }}
          commit: main
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ env.image_name }}.7z
